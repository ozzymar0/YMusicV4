name: Verify unified library (Kotlin and Windows)
on:
  push:
    branches:
      - feature/unified-offline-library
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: unified-library-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kotlin:
    name: Shared Kotlin unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate offline selection and download tests
        run: ./gradlew --no-daemon :commonUi:jvmTest :download:jvmTest
  windows:
    name: Windows Rust desktop checks
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        working-directory: desktopRust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopRust
      - name: Test Rust media database
        run: cargo test --locked -p ym-store
      - name: Check Windows desktop compilation
        run: cargo check --locked -p ymusic
