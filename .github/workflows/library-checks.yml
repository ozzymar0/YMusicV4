name: Verify unified library (Kotlin and Windows)
on:
  push:
    branches:
      - feature/unified-offline-library
permissions:
  contents: read
concurrency:
  group: unified-library-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kotlin:
    name: Shared Kotlin unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate offline selection and download tests
        run: ./gradlew --no-daemon :commonUi:jvmTest :download:jvmTest
  windows:
    name: Windows Rust checks and portable x64 app (MinGW)
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Disable Git CRLF rewrites
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Check out matching FFmpeg build sources
        uses: actions/checkout@v4
        with:
          repository: ymusic-io/ffmpeg-build
          ref: 4d2dc9ae0c73dc5f01733f18af070412013a6a93
          submodules: recursive
          path: ffmpeg-build
          persist-credentials: false
      # Match upstream's MinGW Rust target. QuickJS's C sources are not MSVC-compatible.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: git make diffutils autoconf automake libtool patch mingw-w64-x86_64-toolchain mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-zlib
          cache: false
      - name: Restore FFmpeg libraries needed by Rust MSE
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            ffmpeg-build/out/windows-x86_64
            ffmpeg-build/.deps
          key: ffmpeg-windows-mingw64-4d2dc9ae0c73dc5f01733f18af070412013a6a93
      - name: Build native Windows FFmpeg and MSE dependencies
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        working-directory: ffmpeg-build
        shell: msys2 {0}
        env:
          HOST_CC: gcc
        run: |
          scripts/build-desktop.sh || {
            for log in .deps/.build/*/config.log; do
              [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
            done
            exit 1
          }
      - name: Verify matching FFmpeg libraries and headers
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -s ffmpeg-build/out/windows-x86_64/pack/ffmpeg.exe
          test -d ffmpeg-build/out/windows-x86_64/include
          test -d ffmpeg-build/out/windows-x86_64/lib
      - name: Set up Java for required engine bundles
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node for required engine bundles
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build JavaScript engine and player bundles for Rust includes
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :engine-js:closureJs :engine-js:closurePlayerJs
          test -s engine-js/build/dist/engine.js
          test -s engine-js/build/dist/player.js
      - name: Install Rust GNU host
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopRust -> target
          key: windows-x86_64-gnu
      - name: Test Rust media store
        working-directory: desktopRust
        shell: bash
        run: |
          set -euo pipefail
          mingw="$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')/mingw64/bin"
          export PATH="$mingw:$PATH"
          cargo test --locked -p ym-store
      - name: Check Windows Rust application
        working-directory: desktopRust
        shell: bash
        run: |
          set -euo pipefail
          mingw="$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')/mingw64/bin"
          export PATH="$mingw:$PATH"
          export FFMPEG_BUILD_DIR="$(cygpath -m "$GITHUB_WORKSPACE/ffmpeg-build")"
          cargo check --locked -p ymusic
      - name: Test unified Rust playback and offline playlist snapshots
        working-directory: desktopRust
        shell: bash
        run: |
          set -euo pipefail
          mingw="$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')/mingw64/bin"
          export PATH="$mingw:$PATH"
          export FFMPEG_BUILD_DIR="$(cygpath -m "$GITHUB_WORKSPACE/ffmpeg-build")"
          cargo test --locked -p ymusic unified_offline_tests
          cargo test --locked -p ymusic offline_playlists::tests
          cargo test --locked -p ymusic download_index::tests
      - name: Build portable production Windows application and dependencies
        working-directory: desktopRust
        shell: bash
        run: |
          set -euo pipefail
          mingw="$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')/mingw64/bin"
          export PATH="$mingw:$PATH"
          export YMUSIC_V4_DIR="$GITHUB_WORKSPACE"
          export FFMPEG_BUILD_DIR="$GITHUB_WORKSPACE/ffmpeg-build"
          tools/package-windows.sh --out "$GITHUB_WORKSPACE/dist"
          test -s "$GITHUB_WORKSPACE/dist/YMusic/YMusic.exe"
          test -s "$GITHUB_WORKSPACE/dist/YMusic/ffmpeg.exe"
          find "$GITHUB_WORKSPACE/dist/YMusic" -maxdepth 1 -type f -print
      - name: Publish portable Windows x64 app
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Windows-x64-unified-offline-portable
          path: dist/YMusic/
          if-no-files-found: error
          retention-days: 14
